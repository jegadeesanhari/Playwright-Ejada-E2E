
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Playwright UI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
      ERROR_USER: ${{ secrets.ERROR_USER }}
      VISUAL_USER: ${{ secrets.VISUAL_USER }}
      PERFORMANCE_GLITCH_USER: ${{ secrets.PERFORMANCE_GLITCH_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Install only required browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      # 5. Validate environment configuration
      - name: Validate Environment Configuration
        run: |
          node -e "
          const keys = [
            'BASE_URL',
            'STANDARD_USER',
            'LOCKED_OUT_USER',
            'PROBLEM_USER',
            'ERROR_USER',
            'VISUAL_USER',
            'PERFORMANCE_GLITCH_USER',
            'PASSWORD'
          ];
          const missing = keys.filter(key => !process.env[key]?.trim());
          if (missing.length) {
            throw new Error('Missing environment variables: ' + missing.join(', '));
          }
          console.log('All required environment variables are configured.');
          "

      # 6. Execute all UI tests
      - name: Run Playwright UI Tests
        run: npx playwright test tests/ui/

      # 7. Setup Java for Allure CLI
      - name: Setup Java for Allure
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      # 9. Upload generated Allure HTML report
      - name: Upload Allure HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      # 10. Upload raw Allure results
      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # 11. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      # 12. Upload screenshots, videos and traces
      - name: Upload Test Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
