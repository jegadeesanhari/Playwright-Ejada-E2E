
name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: EXECUTE PLAYWRIGHT TESTS
  # ==========================================

  test:
    name: Playwright UI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BOOKS_API_URL: ${{ secrets.BOOKS_API_URL }}
      BASE_URL: ${{ secrets.BASE_URL }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
      ERROR_USER: ${{ secrets.ERROR_USER }}
      VISUAL_USER: ${{ secrets.VISUAL_USER }}
      PERFORMANCE_GLITCH_USER: ${{ secrets.PERFORMANCE_GLITCH_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Install required browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox chrome

      # 5. Validate environment variables
      - name: Validate Environment Configuration
        run: |
          node -e "
          const keys = [
            'BASE_URL',
            'STANDARD_USER',
            'LOCKED_OUT_USER',
            'PROBLEM_USER',
            'ERROR_USER',
            'VISUAL_USER',
            'PERFORMANCE_GLITCH_USER',
            'PASSWORD'
          ];
          const missing = keys.filter(key => !process.env[key]?.trim());
          if (missing.length) {
            throw new Error('Missing environment variables: ' + missing.join(', '));
          }
          new URL(process.env.BASE_URL);
          console.log('Environment configuration validated successfully.');
          "

      # 6. Execute all UI tests
      - name: Run Playwright UI and API Tests
        run: npx playwright test

      # 7. Setup Java for Allure reporting
      - name: Setup Java for Allure
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Generate Allure HTML report
      - name: Generate Allure HTML Report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      # 9. Upload Allure HTML report
      - name: Upload Allure HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

      # 10. Upload raw Allure results
      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # 11. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      # 12. Upload screenshots, videos and traces
      - name: Upload Test Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore


  # ==========================================
  # JOB 2: PUBLISH ALLURE REPORT TO GITHUB PAGES
  # ==========================================

  deploy-report:
    name: Publish Allure Report
    needs: test

    # Publish from main only, even if tests fail.
    # Do not deploy from pull requests.
    if: ${{ always() && needs.test.result != 'cancelled' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. Download generated Allure HTML report
      - name: Download Allure HTML Report
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report
          path: ./allure-report

      # 2. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 3. Upload report as GitHub Pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      # 4. Publish report
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4
